<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002649;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Anchor Icon -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#shadow)">
    <!-- Ring -->
    <circle cx="256" cy="80" r="30" stroke="#F47920" stroke-width="40" fill="none"/>
    
    <!-- Central Shank -->
    <line x1="256" y1="110" x2="256" y2="360" stroke="#F47920" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Crossbar (Stock) -->
    <line x1="160" y1="160" x2="352" y2="160" stroke="#F47920" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Arms -->
    <path d="M140,260 C140,260 140,400 256,400 C372,400 372,260 372,260" 
          stroke="#F47920" stroke-width="40" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
          
    <!-- Flukes (Tips) -->
    <path d="M140,260 L110,230" stroke="#F47920" stroke-width="40" stroke-linecap="round"/>
    <path d="M372,260 L402,230" stroke="#F47920" stroke-width="40" stroke-linecap="round"/>
  </g>
</svg>